name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test -covermode=atomic -coverprofile=coverage.txt ./...
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.txt
          fail_ci_if_error: false

  interop:
    name: Interop (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['10', '11', '12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, mbstring
          tools: composer
      - name: Install the real Laravel ${{ matrix.laravel }} encryption, cookie, session and database packages
        run: >
          composer require
          "illuminate/encryption:^${{ matrix.laravel }}.0"
          "illuminate/cookie:^${{ matrix.laravel }}.0"
          "illuminate/session:^${{ matrix.laravel }}.0"
          "illuminate/database:^${{ matrix.laravel }}.0"
          --no-interaction --no-progress

      # Laravel -> Go: PHP generates fresh vectors, Go decrypts them.
      - name: Generate Laravel vectors
        run: |
          php scripts/generate_vectors.php
          php scripts/generate_app_vectors.php
          php vendor/rene-roscher/laravel-interop/bin/generate-vectors.php
          cp vendor/rene-roscher/laravel-interop/fixtures/envelope-vectors.json fixtures/envelope-vectors.json
      - name: Go decrypts Laravel vectors
        run: go test -count=1 ./...

      # Go -> Laravel: Go encrypts, PHP decrypts and asserts.
      - name: Laravel decrypts Go vectors
        run: go run ./cmd/genvectors | php scripts/verify_go_vectors.php

      # Malformed input: Go and Laravel must accept and reject exactly the same payloads.
      - name: Go and Laravel judge mutated payloads alike
        run: go run ./cmd/mutations | php scripts/verify_mutations.php

      # Interop Envelope: the Laravel package (rene-roscher/laravel-interop) judges the tokens this
      # package issues, and our copy of its vectors must still be the package's.
      - name: Laravel package judges our envelope tokens
        run: go run ./cmd/envelope | php vendor/rene-roscher/laravel-interop/bin/verify-tokens.php
      - name: Envelope vectors are the Laravel package's
        run: php vendor/rene-roscher/laravel-interop/e2e/check-fixtures.php fixtures/envelope-vectors.json
